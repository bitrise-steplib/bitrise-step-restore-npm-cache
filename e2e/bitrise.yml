format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_npm:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/Bitrise-React-Native-Sample
    - BRANCH: master
    before_run:
    - _setup
    steps:
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
    - script:
        title: Install dependencies
        inputs:
        - content: |-
            set -ex
            npm install
    - git::git@github.com:bitrise-steplib/bitrise-step-save-cache.git@main:
        run_if: "true"
        is_skippable: false
        inputs:
        - key: |-
            {{ getenv "BITRISEIO_STACK_ID" }}-npm-cache-{{ checksum "package-lock.json" "yarn.lock" }}
        - paths: node_modules
        - verbose: "true"
    - script:
        title: Clean node_modules
        inputs:
        - content: |-
            rm -rf node_modules
    - path::./:
        title: Execute step
        run_if: "true"
        is_skippable: false
        inputs:
        - verbose: "true"
        - key: |-
            {{ getenv "BITRISEIO_STACK_ID" }}-npm-cache-{{ checksum "package-lock.json" "yarn.lock" }}
    - script:
        title: Verify restored folder
        inputs:
        - content: |-
            set -ex

            echo $BITRISE_CACHE_HIT
            if [ ! -d node_modules ]; then
              echo "node_modules directory doesn't exist"
              exit 1
            fi
    - script:
        title: Install dependencies again
        inputs:
        - content: |-
            set -ex
            npm install

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: ./_tmp
        - branch: $BRANCH
